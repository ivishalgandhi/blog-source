# pgBackRest configuration for LAB-08-A
# Repository: S3-compatible (MinIO) running inside the Compose network.

[global]
repo1-type=s3
repo1-path=/repo
repo1-s3-endpoint=minio
repo1-s3-bucket=pgbackrest
repo1-s3-region=us-east-1
repo1-s3-key=minioadmin
repo1-s3-key-secret=minioadmin
repo1-s3-verify-tls=n
repo1-s3-port=9000
repo1-s3-uri-style=path

# Retention: 4 full backups, 7 differentials, archive anchored to differential
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=7
repo1-retention-archive-type=diff

# Performance and reliability
process-max=2
log-level-console=info
start-fast=y

# Stanza for the lab cluster (single primary for Docker lab sidecar)
[lab-08-a]
pg1-path=/home/postgres/pgdata/data
pg1-port=5432
pg1-user=postgres
