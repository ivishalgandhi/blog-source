[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mon"
version = "0.1.0"
description = "AGENT-11-MON: Monitoring agent for Patroni HA clusters"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.25",
    "litellm>=1.40",
]

[project.scripts]
agent-mon = "agent_mon.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mon"]
