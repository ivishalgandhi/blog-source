[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-st"
version = "0.1.0"
description = "AGENT-11-ST: Self-tuning agent for Patroni HA clusters"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.25",
    "litellm>=1.40",
]

[project.scripts]
agent-st = "agent_st.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_st"]
